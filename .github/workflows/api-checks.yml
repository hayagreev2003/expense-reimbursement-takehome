name: API checks

on:
  pull_request:
    paths: &api_paths
      - "backend/**"
      - ".github/workflows/api-checks.yml"
  push:
    branches: [main]
    paths: *api_paths
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # No service container. The database is a SQLite file the test run creates in a temp
    # directory, so there is nothing to provision and nothing for a missing service to skip.
    env:
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest -q
